name: Build & push container

# Builds the R/analysis image from containers/Dockerfile and pushes it to the
# GitHub Container Registry (ghcr.io/<owner>/nf-g4rnaseq-r). Runs automatically
# on a version tag (v*), or on demand. No local Docker needed — GitHub builds it.
#
# After the first run, the image is at:
#   ghcr.io/<your-github-owner>/nf-g4rnaseq-r:<version>   (and :latest)
# Make the package public (repo > Packages > settings) and point the pipeline at
# it: set params.r_container in nextflow.config, or pass --r_container <image>.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # allow pushing to GHCR with GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nf-g4rnaseq-r
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: containers
          file: containers/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
