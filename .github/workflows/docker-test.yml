name: Docker test

# Runs the full pipeline on the bundled chr-I data using -profile test,docker
# (the published GHCR analysis image). It auto-runs after the image is built
# ("Build & push container" completes), weekly, or on demand. Before the image
# is first published it detects the absence and skips the run (job stays green),
# so it never shows red prematurely. Once published, a green badge means
# `-profile test,docker` genuinely works end-to-end (including the Quarto report).

on:
  workflow_run:
    workflows: ["Build & push container"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"      # weekly, Monday 06:00 UTC

jobs:
  test-docker:
    name: End-to-end (-profile test,docker)
    runs-on: ubuntu-latest
    # for the workflow_run trigger, only proceed if the image build succeeded
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: nf-core/setup-nextflow@v2
        with: { version: "latest-stable" }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        name: Is the analysis image published?
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/nf-g4rnaseq-r:latest"
          if docker manifest inspect "$IMG" >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"; echo "image=$IMG" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMG not published yet — skipping docker test. Push a v* tag to build the image."
          fi
      - name: Run -profile test,docker on the bundled chr-I data
        if: steps.check.outputs.exists == 'true'
        run: nextflow run . -profile test,docker --outdir results --r_container ${{ steps.check.outputs.image }}
